<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lufitness">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="color-scheme" content="light dark">
<title>Plano 8 semanas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F7; --surface:#FFFFFF; --ink:#171A33; --muted:#5A6085; --accent:#C0245E; --accent-ink:#FFFFFF;
  --ok:#12805F; --line:#D9DCEB; --soft:#F6F7FC; --warn-bg:#FFF1D6; --warn-ink:#6B4500;
  --head:'Sora',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0F1120; --surface:#191C33; --ink:#EEF0FF; --muted:#9AA0C8; --accent:#FF6A9C; --accent-ink:#1A0610;
    --ok:#4FD1A5; --line:#2A2E52; --soft:#212544; --warn-bg:#3A2D10; --warn-ink:#FFD992;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1120; --surface:#191C33; --ink:#EEF0FF; --muted:#9AA0C8; --accent:#FF6A9C; --accent-ink:#1A0610;
  --ok:#4FD1A5; --line:#2A2E52; --soft:#212544; --warn-bg:#3A2D10; --warn-ink:#FFD992;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;
  padding-bottom:calc(84px + env(safe-area-inset-bottom,0px));}
.wrap{max-width:640px;margin:0 auto;padding:18px 16px 24px}
h1,h2,h3{font-family:var(--head);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:44px;font-weight:800}
h2{font-size:22px;font-weight:700;margin:26px 0 10px}
h3{font-size:17px;font-weight:700}
p{margin:0 0 10px}
.muted{color:var(--muted)}
.sub{font-size:15px;color:var(--muted);margin-top:6px}
.weeks{display:grid;grid-template-columns:repeat(8,1fr);gap:4px;margin:16px 0 4px}
.weeks i{height:8px;border-radius:4px;background:var(--line)}
.weeks i.past{background:var(--ok)}
.weeks i.now{background:var(--accent)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}
.card.flat{border-radius:12px}
.row{display:flex;gap:12px;align-items:flex-start}
.check{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line);cursor:pointer;-webkit-tap-highlight-color:transparent}
.check:first-of-type{border-top:0}
.check input{appearance:none;-webkit-appearance:none;flex:none;width:26px;height:26px;border-radius:8px;border:2px solid var(--muted);
  margin:1px 0 0;background:transparent;display:grid;place-items:center}
.check input:checked{background:var(--ok);border-color:var(--ok)}
.check input:checked::after{content:"";width:6px;height:12px;border:solid #fff;border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.check input:focus-visible,button:focus-visible,summary:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.check .t{font-weight:600}
.check input:checked ~ .tx .t{text-decoration:line-through;color:var(--muted)}
.check .d{font-size:14px;color:var(--muted)}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px;background:var(--soft);border:1px solid var(--line);color:var(--muted)}
.pill.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin:0 -2px}
.days button{flex:1 0 auto;min-width:48px;padding:10px 8px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);cursor:pointer}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
details{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin:10px 0;overflow:hidden}
summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;font-family:var(--head);font-size:16px;display:flex;justify-content:space-between;gap:10px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:22px;color:var(--accent);line-height:1}
details[open] summary::after{content:"–"}
details .in{padding:0 16px 16px}
details ul,details ol{margin:6px 0 10px;padding-left:20px}
details li{margin:3px 0}
.ex{padding:12px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.ex .name{font-weight:700}
.ex .sets{font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;margin-top:2px}
.note{background:var(--warn-bg);color:var(--warn-ink);border-radius:12px;padding:12px 14px;font-size:14.5px;margin:12px 0}
.tl{margin:0;padding:0;list-style:none}
.tl li{display:flex;gap:14px;padding:10px 0;border-top:1px solid var(--line)}
.tl li:first-child{border-top:0}
.tl b{font-family:var(--head);min-width:56px;color:var(--accent)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:600 12px var(--body);padding:8px 2px;border-radius:12px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px}
.field label{font-size:14px;font-weight:600}
input[type=number],input[type=date],select{font:500 17px var(--body);padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{font:700 16px var(--head);background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;width:100%}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.stat{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
.stat div{background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:12px}
.stat strong{display:block;font-family:var(--head);font-size:24px}
.stat span{font-size:13px;color:var(--muted)}
.cups{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.cups button{width:34px;height:44px;border-radius:8px 8px 12px 12px;border:2px solid var(--accent);background:transparent;cursor:pointer}
.cups button[aria-pressed="true"]{background:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:15px}
td,th{padding:8px 4px;border-top:1px solid var(--line);text-align:left}
.chart{width:100%;height:150px;display:block;margin-top:8px}
.loadrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:0 0 12px 38px}
.loadrow.flat{padding:8px 0 0}
.loadrow label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.loadrow input[type=number]{width:92px;padding:8px 10px;font-size:16px}
.hist{font-size:13px;color:var(--muted)}
.mealpick{padding:0 0 12px 38px}
.mealpick select{font-size:15px;padding:9px 10px}
.evo{min-width:520px;font-size:14px}
.evo td,.evo th{white-space:nowrap;padding:7px 8px}
.evo td:first-child{white-space:normal;min-width:150px}
#timer{position:fixed;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tpill{display:flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);font:700 16px var(--head);box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.tpill svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tpill.done{background:var(--ok);color:#fff}
.tpanel{width:min(320px,calc(100vw - 24px));background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.tbig{font:800 56px var(--head);text-align:center;letter-spacing:-.02em;line-height:1.1}
.tbar{height:8px;border-radius:4px;background:var(--line);overflow:hidden;margin:8px 0 10px}
.tbar i{display:block;height:100%;background:var(--accent);width:0}
.tgrid,.tctl{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tgrid{margin-bottom:10px}
.tgrid button,.tctl button{font:700 15px var(--body);padding:12px 6px;border-radius:12px;border:1px solid var(--line);background:var(--soft);color:var(--ink);cursor:pointer}
@media (prefers-reduced-motion:no-preference){.tpill.done{animation:flash .8s ease-in-out 4}@keyframes flash{50%{transform:scale(1.08)}}}
@media (prefers-reduced-motion:no-preference){ details .in{animation:open .18s ease-out} @keyframes open{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}} }
</style>
</head>

const state={tab:'hoje',day:new Date().getDay()};
function todayISO(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function startISO(){let s=sget('start');if(!s){s=todayISO();sset('start',s)}return s}
function weekNum(){
  const s=new Date(startISO()+'T00:00:00'),n=new Date(todayISO()+'T00:00:00');
  const w=Math.floor((n-s)/86400000/7)+1;return Math.min(8,Math.max(1,w));
}
function dayNum(){const s=new Date(startISO()+'T00:00:00'),n=new Date(todayISO()+'T00:00:00');return Math.floor((n-s)/86400000)+1}
function phase(){return weekNum()<=4?1:2}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function isDone(k){return sget('d:'+k)==='1'}

function weekStrip(){

}
function head(title,sub){return `<h1>${title}</h1><p class="sub">${sub}</p>${weekStrip()}`}

function exerciseChecks(wk,w){
  const p=phase();
  return wk.ex.map((e,i)=>{
    const key=`w${w}:${wk.id}:${i}`;
    return `<label class="check"><input type="checkbox" data-check="${key}" ${isDone(key)?'checked':''}>
      <span class="tx"><span class="t">${esc(e.n)}</span><br><span class="d">${esc(p===1?e.p1:e.p2)}</span></span></label>`+loadRow(wk,i,w);

function calc(){
  const g=id=>parseFloat(document.getElementById(id).value);
  const sex=document.getElementById('c-sex').value,age=g('c-age'),h=g('c-h'),wt=g('c-w');

   <polyline fill="none" stroke="var(--accent)" stroke-width="3" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>

   <text x="${pad}" y="${H-4}" font-size="11" fill="var(--muted)">${mn.toFixed(0)} kg</text></svg>`;
}

/* ---------- timer de descanso ---------- */
const T={open:false,running:false,end:0,paused:0,total:0,done:false,iv:null};
let ac=null,wl=null;
function fmtT(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function lblT(s){return s<60?s+' s':(s%60===0?(s/60)+' min':s+' s')}
function tRem(){return T.running?Math.max(0,T.end-Date.now()):T.paused}
function beep(){
  try{if(ac){[0,0.25,0.5].forEach(d=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=880;g.gain.value=0.2;o.connect(g);g.connect(ac.destination);o.start(ac.currentTime+d);o.stop(ac.currentTime+d+0.15)})}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200])}catch(e){}
}
async function wake(on){
  try{
    if(on){if(navigator.wakeLock&&!wl)wl=await navigator.wakeLock.request('screen')}
    else if(wl){await wl.release();wl=null}
  }catch(e){wl=null}
}
function tick(){
  const r=tRem();
  const big=document.getElementById('t-big'),pill=document.getElementById('t-pill'),bar=document.getElementById('t-bar');
  if(T.running||T.paused>0){
    if(big)big.textContent=fmtT(r);
    if(pill)pill.textContent=fmtT(r);
    if(bar)bar.style.width=(T.total?Math.min(100,100-r/T.total*100):0)+'%';
  }
  if(T.running&&r<=0){T.running=false;T.paused=0;T.done=true;clearInterval(T.iv);T.iv=null;wake(false);beep();renderTimer();}
}
function startTick(){if(!T.iv)T.iv=setInterval(tick,250)}
function tStart(sec){
  try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.resume)ac.resume()}catch(e){}
  T.total=sec*1000;T.end=Date.now()+T.total;T.running=true;T.done=false;T.paused=0;startTick();wake(true);renderTimer();
}
function tPause(){
  if(T.running){T.paused=tRem();T.running=false}
  else if(T.paused>0){T.end=Date.now()+T.paused;T.running=true;startTick()}
  renderTimer();
}
function tReset(){T.running=false;T.paused=0;T.done=false;T.total=0;clearInterval(T.iv);T.iv=null;wake(false);renderTimer()}
function tAdd(s){
  if(T.running){T.end+=s*1000;T.total+=s*1000}
  else if(T.paused>0){T.paused+=s*1000;T.total+=s*1000}
  renderTimer();
}
function renderTimer(){
  const el=document.getElementById('timer');if(!el)return;
  const r=tRem(),idle=!T.running&&T.paused===0&&!T.done;
  let h='';
  if(T.open){
    h+=`<div class="tpanel" role="dialog" aria-label="Timer de descanso"><div class="tbig" id="t-big">${idle||T.done?'0:00':fmtT(r)}</div>
    <div class="tbar"><i id="t-bar" style="width:${T.total&&!idle&&!T.done?Math.min(100,100-r/T.total*100):(T.done?100:0)}%"></i></div>
    <p class="muted" style="font-size:13.5px;margin:0 0 10px;text-align:center">${T.done?'Descanso acabou! Próxima série.':'Compostos: 90 a 120 s · Isoladores: 60 s'}</p>
    <div class="tgrid">${[45,60,90,120,150,180].map(s=>`<button data-t="start" data-s="${s}">${lblT(s)}</button>`).join('')}</div>
    <div class="tctl"><button data-t="pause">${(T.running||idle||T.done)?'Pausar':'Retomar'}</button><button data-t="add">+15 s</button><button data-t="reset">Zerar</button></div></div>`;
  }
  h+=`<button class="tpill${T.done?' done':''}" data-t="toggle" aria-expanded="${T.open}" aria-label="Timer de descanso"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg><span id="t-pill">${T.done?'Acabou!':idle?'Descanso':fmtT(r)}</span></button>`;
  el.innerHTML=h;
}

const PROT={almoco:[55,50,43,38,36,38,56,42],lanche:[15,26,21,22,22,17,18,17,18,17],jantar:[47,47,29,28,37,24,49,36,25],pre:[6,5,10,2],ceia:[5,7,10,2]};
function isoOf(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mealCat(t){return /^Almoço/.test(t)?'almoco':/^Lanche/.test(t)?'lanche':/^Jantar/.test(t)?'jantar':/^Pré-treino leve/.test(t)?'pre':null}
function optInfo(cat,i){const m=MEALS.find(x=>x.id===cat),o=m&&m.opts[i];if(!o)return null;const k=(o.d.match(/≈\s*(\d+)\s*kcal/)||[])[1];return{o,kcal:+k||0,p:(PROT[cat]||[])[i]||0}}
function picked(cat,key){const v=sget('meal:'+key);return v!==null&&v!==''?optInfo(cat,+v):null}
function mealPick(cat,key){
  const v=sget('meal:'+key),m=MEALS.find(x=>x.id===cat),inf=picked(cat,key);
  return `<div class="mealpick"><select data-meal="${key}" aria-label="Escolher opção"><option value="">Escolher opção…</option>${m.opts.map((o,i)=>`<option value="${i}" ${v===String(i)?'selected':''}>${esc(o.t)}</option>`).join('')}</select>${inf?`<div class="hist" style="margin-top:6px">${esc(inf.o.d)} · ≈ ${inf.p} g de proteína</div>`:''}</div>`;

function targets(){const g=(k,d)=>parseFloat(sget('c:'+k)||d),sx=sget('c:sex')||'f',a=g('age',23),h=g('h',160),w=g('w',64),bmr=10*w+6.25*h-5*a+(sx==='m'?5:-161);return{kcal:Math.round(Math.max(bmr*1.55*0.8,bmr)/10)*10,prot:Math.round(w*1.8)}}
function dayTot(iso,dd){let k=0,p=0;(DAYPLAN[dd]||[]).forEach((m,i)=>{const c=mealCat(m[1]),x=c&&picked(c,iso+':'+i);if(x){k+=x.kcal;p+=x.p}});const x=picked('ceia',iso+':ceia');if(x){k+=x.kcal;p+=x.p}return{k,p}}

  ANG.forEach(a=>PH.forEach(p=>{const k=p[0]+':'+a[0],img=sget('ph:'+k);g+=`<label style="aspect-ratio:3/4;border:1px dashed var(--muted);border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:13px;color:var(--muted);cursor:pointer;background:var(--soft)">${img?`<img src="${img}" alt="${a[1]} ${p[1]}" style="width:100%;height:100%;object-fit:cover">`:a[1]+' +'}<input type="file" accept="image/*" data-photo="${k}" hidden></label>`}));
  g+='</div>';
  return `<div class="card"><h3>Fotos de progresso</h3><p class="muted" style="font-size:14.5px;margin:4px 0">Toque em um quadrado para tirar ou escolher a foto. Toque de novo para trocar. As fotos ficam só no seu iPhone.</p>${g}</div>`;
}
function backupCard(){return `<div class="card"><h3>Backup dos dados</h3><p class="muted" style="font-size:14.5px;margin:4px 0 10px">Guarda peso, cargas, refeições e checks. Salve o arquivo em Arquivos ou no iCloud para não perder se trocar de aparelho.</p><label class="check" style="border:0;padding:0 0 10px"><input type="checkbox" id="bk-ph" checked><span class="tx"><span class="t">Incluir fotos</span></span></label><button class="btn" data-act="bkexp">Salvar backup</button><div class="field" style="margin-top:14px"><label for="bk-file">Restaurar de um arquivo</label><input id="bk-file" type="file" accept=".json,application/json,text/plain"></div></div>`}
async function bkExport(){
  const o={},inc=document.getElementById('bk-ph').checked;
  try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(inc||!k.startsWith('ph:'))o[k]=localStorage.getItem(k)}}catch(e){Object.assign(o,mem)}
  const file=new File([JSON.stringify(o)],'backup-lufitness-'+todayISO()+'.json',{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file]});return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=file.name;document.body.appendChild(a);a.click();a.remove();
}

/* ---------- render ---------- */
function render(){
  const app=document.getElementById('app');
  app.innerHTML={hoje:viewHoje,treino:viewTreino,dieta:viewDieta,receitas:viewReceitas,mercado:viewMercado,meta:viewMeta}[state.tab]();
  renderTabs();
  if(state.tab==='meta'){
    const DEF={sex:'f',age:'23',h:'160',w:'64'};
    ['sex','age','h','w'].forEach(k=>{const v=sget('c:'+k);document.getElementById('c-'+k).value=v!==null?v:DEF[k]});
    calc();
  }
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-go],[data-day],[data-cup],[data-act]');
  if(!t)return;
  if(t.dataset.tab||t.dataset.go){state.tab=t.dataset.tab||t.dataset.go;render();window.scrollTo(0,0);return}
  if(t.dataset.day!==undefined){state.day=parseInt(t.dataset.day,10);render();return}
  if(t.dataset.cup){const k='cups:'+todayISO(),n=parseInt(t.dataset.cup,10),cur=parseInt(sget(k)||'0',10);sset(k,String(cur===n?n-1:n));render();return}
  const a=t.dataset.act;
  if(a==='calc')calc();
  if(a==='wdone'){const k='wd:'+todayISO();sset(k,sget(k)?'':t.dataset.wk);render();}
  if(a==='shift'){const s=new Date(startISO()+'T00:00:00');s.setDate(s.getDate()+7);sset('start',isoOf(s));render();}
  if(a==='bkexp')bkExport();
  if(a==='mkreset'){GROCERY.forEach((c,ci)=>c[1].forEach((_,ii)=>sset('d:mk:'+ci+'-'+ii,'0')));render();}
  if(a==='log'){
    const w=parseFloat(document.getElementById('l-w').value),c=parseFloat(document.getElementById('l-c').value);
    if(!(w>=30&&w<=300))return;
    const log=getLog().filter(x=>x.d!==todayISO());log.push({d:todayISO(),w:w,c:isNaN(c)?null:c});log.sort((x,y)=>x.d<y.d?-1:1);
    sset('log',JSON.stringify(log));render();
  }
  if(a==='start'){const v=document.getElementById('s-start').value;if(v){sset('start',v);render()}}
});
document.addEventListener('change',e=>{
  const c=e.target.closest('[data-check]');
  if(c)sset('d:'+c.dataset.check,c.checked?'1':'0');
  const s=e.target.closest('[data-lw]');
  if(s){state.week=parseInt(s.value,10);render();}
  const ml=e.target.closest('[data-meal]');
  if(ml){sset('meal:'+ml.dataset.meal,ml.value);render();}
  const sp=e.target.closest('[data-swap]');
  if(sp){sset('swap:'+todayISO(),sp.value);render();}
  const ph=e.target.closest('[data-photo]');
  if(ph&&ph.files[0]){
    const k=ph.dataset.photo,im=new Image(),u=URL.createObjectURL(ph.files[0]);
    im.onload=()=>{const sc=Math.min(1,560/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*sc;c.height=im.height*sc;c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);const data=c.toDataURL('image/jpeg',0.72);try{localStorage.setItem('ph:'+k,data);mem['ph:'+k]=data}catch(err){alert('Sem espaço para salvar a foto.');return}render()};
    im.src=u;
  }
  const bf=e.target.closest('#bk-file');
  if(bf&&bf.files[0]){bf.files[0].text().then(t=>{try{const o=JSON.parse(t);if(!o||typeof o!=='object')throw 0;if(!confirm('Restaurar este backup? Os dados atuais serão sobrescritos.'))return;Object.keys(o).forEach(k=>{if(typeof o[k]==='string')sset(k,o[k])});render();alert('Backup restaurado.')}catch(err){alert('Arquivo de backup inválido.')}})}
});
document.addEventListener('input',e=>{
  const l=e.target.closest('[data-load]');
  if(l)sset('ld:'+l.dataset.load,l.value);
});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-t]');
  if(!t)return;
  const a=t.dataset.t;
  if(a==='toggle'){T.open=!T.open;renderTimer();}
  else if(a==='start')tStart(parseInt(t.dataset.s,10));
  else if(a==='pause')tPause();
  else if(a==='reset')tReset();
  else if(a==='add')tAdd(15);
});
render();
renderTimer();
</script>
</body>
</html>
